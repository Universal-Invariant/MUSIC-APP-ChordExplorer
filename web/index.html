<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmonic Interpolator — chord ↔ scale analysis</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1>Harmonic Interpolator</h1>
    <p class="tagline">Enter chords in time order · find the scales that interpolate them · build chords from scales</p>
    <nav id="mode-tabs"></nav>
  </header>

  <main>
    <section id="panel-timeline" class="col col-wide"></section>
    <aside class="col col-side">
      <div id="panel-chord"></div>
      <div id="panel-scale"></div>
      <div id="panel-reverse"></div>
      <div id="panel-explore"></div>
    </aside>
  </main>

  <footer>
    <p>Set-theory engine under the hood: every chord is a pitch-class set; every transition is scored against the scale catalog and the curated relationship table.</p>
  </footer>

  <script type="module" src="../web-dist/web/main.js"></script>
</body>
</html>
